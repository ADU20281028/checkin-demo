server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  jackson:
    time-zone: Asia/Shanghai

app:
  access-token-hours: 168
  qr-ttl-seconds: 60

logging:
  level:
    com.lgk.checkin: INFO
